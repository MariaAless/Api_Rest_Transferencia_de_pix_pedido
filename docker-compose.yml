
services:
  postgres:
    image: postgres:16-alpine
    container_name: pix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pix_db}
      POSTGRES_USER: ${DB_USERNAME:-pix_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pix_password}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
